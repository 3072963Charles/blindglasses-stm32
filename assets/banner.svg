<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="BrightEyes Offline Safety Layer - STM32H743 Sensor Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170a07"/>
      <stop offset="0.55" stop-color="#3b1a0d"/>
      <stop offset="1" stop-color="#c2541f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0 L0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
    <text x="72" y="106" font-size="46" font-weight="700" fill="#ffffff">明眸 BrightEyes · <tspan fill="#fdba74">离线安全层</tspan></text>
    <text x="74" y="148" font-size="22" fill="#fed7aa" opacity="0.92">STM32H743 主控 · 多传感器融合 · 本地闭环守护</text>
    <text x="74" y="194" font-size="25" font-weight="600" fill="#ffffff">全域无盲区感知 / 七级流水线避障 / 双路径跌倒检测</text>
    <g font-size="18" font-weight="600">
      <rect x="72" y="228" width="238" height="40" rx="20" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="191" y="253" text-anchor="middle" fill="#fdba74">10Hz · 延迟 &lt;100ms</text>
      <rect x="326" y="228" width="238" height="40" rx="20" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="445" y="253" text-anchor="middle" fill="#fed7aa">360° 无盲区感知</text>
      <rect x="580" y="228" width="238" height="40" rx="20" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="699" y="253" text-anchor="middle" fill="#fca5a5">三级风险预警</text>
      <rect x="834" y="228" width="238" height="40" rx="20" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="953" y="253" text-anchor="middle" fill="#a5f3fc">12 条中文语音引导</text>
    </g>
  </g>
</svg>